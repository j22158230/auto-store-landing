<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품 발주 신청서 — FNB미디어</title>
<style>
:root{--ink:#20242a;--sub:#6b7280;--line:#e6e8eb;--bg:#f4f5f7;--card:#fff;--accent:#d94b28;--accent-soft:#fde9e2;--ok:#127a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 150px}
.head{padding:8px 2px 20px}
.head .ey{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.head h1{font-size:26px;margin:8px 0 6px;font-weight:900;letter-spacing:-.02em}
.head p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.card h2 small{font-weight:600;color:var(--sub);font-size:12px;margin-left:6px}
.minNote{display:flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;border-radius:10px;padding:10px 12px;margin:2px 0 4px}
label.f{display:block;margin-top:14px}
label.f span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
label.f span i{color:var(--accent);font-style:normal}
input[type=text],input[type=tel]{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;background:#fff}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brandGrid{display:grid;gap:12px}
.brandCard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.brandCard:hover,.brandCard:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brandCard b{font-size:16px;font-weight:800;display:block}
.brandCard small{display:block;color:var(--sub);font-size:12px;margin-top:4px}
.brandCard .arw{color:var(--accent);font-size:20px;font-weight:800;flex:none}
.backLink{display:inline-flex;align-items:center;gap:5px;color:var(--sub);font-size:13px;font-weight:700;background:none;border:0;cursor:pointer;padding:4px 0;margin-bottom:8px;font-family:inherit}
.brandTag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;padding:6px 13px;border-radius:20px}
.prod{display:flex;align-items:center;gap:12px;padding:16px 2px;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0}
.prodInfo{flex:1;min-width:0}
.prodInfo b{display:block;font-size:15px;font-weight:800}
.prodInfo small{color:var(--sub);font-size:12px}
.prodPrice{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap}
.prodPrice em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--sub);text-align:right}
.tg{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg .tk{position:absolute;inset:0;background:#d3d7dd;border-radius:26px;transition:.18s}
.tg .tk:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked + .tk{background:var(--accent)}
.tg input:checked + .tk:before{transform:translateX(20px)}
.qtyRow{display:none;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 14px;margin-top:-4px}
.qtyRow.on{display:flex}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:40px;font-size:20px;font-weight:700;background:#fff;border:0;color:var(--ink);cursor:pointer}
.stepper button:active{background:var(--bg)}
.stepper input{width:52px;height:40px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);font:inherit;font-weight:800}
.qtyUnit{font-size:12px;color:var(--sub);font-weight:700;margin-left:-4px}
.lineSum{font-size:14px;font-weight:800;color:var(--accent)}
.totalBox{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 2px;border-top:2px solid var(--ink);margin-top:6px}
.totalBox .lbl{font-size:15px;font-weight:800}
.totalBox .lbl em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--sub);margin-top:2px}
.totalBox .val{font-size:24px;font-weight:900;letter-spacing:-.02em;text-align:right}
.totalBox .val small{font-size:14px;font-weight:700;margin-left:3px}
.totalBox .val em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--sub)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5}
.check input{margin-top:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.06);display:none}
.bar.on{display:block}
.bar .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .sum{flex:1;min-width:0}
.bar .sum small{display:block;font-size:11px;font-weight:700;color:var(--sub)}
.bar .sum small.warn{color:var(--accent)}
.bar .sum b{font-size:19px;font-weight:900}
.btn{flex:none;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:15px 22px;font-size:16px;font-weight:800;cursor:pointer}
.btn:disabled{background:#c9ccd1;cursor:not-allowed}
.msg{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.done{text-align:center;padding:40px 10px}
.done .ic{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:34px;line-height:64px;margin:0 auto 16px}
.done h2{font-size:22px;margin:0 0 10px}
.done p{color:var(--sub);line-height:1.7;font-size:14px}
.done .rc{text-align:left;background:var(--bg);border-radius:12px;padding:16px;margin-top:18px;font-size:14px;line-height:1.9}
.hidden{display:none}
.fhint{display:block;font-size:11.5px;color:var(--sub);margin-top:7px;line-height:1.55}
.payRow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.payRow span{color:var(--sub);font-weight:700}
.payRow b{font-weight:800}
.payRow.acc b{font-size:19px;letter-spacing:.02em;color:var(--accent)}
.copyBtn{width:100%;margin:15px 0 4px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:11px;padding:13px;font-size:14.5px;font-weight:800;cursor:pointer}
.copyBtn:active{background:#fbdccf}
.payTotal{display:flex;justify-content:space-between;align-items:center;padding:15px 0 2px;border-top:2px solid var(--ink);margin-top:10px}
.payTotal span{font-weight:800;font-size:15px}
.payTotal b{font-size:22px;font-weight:900}
.btnWide{width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;margin-top:2px}
.ord{font-size:14px;line-height:1.95}
</style></head>
<body><div class="wrap" id="wrap">

<!-- STEP 1: 브랜드 선택 -->
<div id="brandStep">
  <div class="head">
    <div class="ey">FNB미디어 · 제품 발주</div>
    <h1>브랜드를 선택하세요</h1>
    <p>발주하실 브랜드를 먼저 선택하시면, 해당 브랜드에서 주문 가능한 제품이 나타납니다.</p>
  </div>
  <div class="brandGrid" id="brandGrid"></div>
</div>

<!-- STEP 2: 발주 폼 -->
<div id="orderStep" class="hidden">
  <div class="head">
    <button type="button" class="backLink" onclick="goBrand()">← 브랜드 다시 선택</button>
    <div><span class="brandTag" id="brandTag">브랜드</span></div>
    <h1 style="margin-top:12px">제품 발주 신청서</h1>
    <p>지점 정보와 발주 제품을 선택하시면 합계가 자동 계산됩니다.</p>
  </div>

  <form id="orderForm" onsubmit="return submitOrder(event)" novalidate>
    <div class="card">
      <h2>주문 정보</h2>
      <label class="f"><span>지점명 <i>*</i></span><input type="text" name="branch" placeholder="예) 서정점"></label>
      <label class="f"><span>주문자 성함 <i>*</i></span><input type="text" name="name" placeholder="성함"></label>
      <label class="f"><span>연락처 <i>*</i></span><input type="tel" name="phone" placeholder="010-0000-0000"></label>
      <label class="f"><span>배송받을 주소 <i>*</i></span><input type="text" name="address" placeholder="도로명 주소 + 상세주소"><small class="fhint">예) 서울시 00구 00동 123번지 스마일타워 1층 · 정확한 주소를 기입해 주셔야 오배송 없이 출고가 가능합니다.</small></label>
    </div>

    <div class="card">
      <h2>발주 제품 <small>1BOX = 16kg · 단가는 BOX 기준</small></h2>
      <div class="minNote">⚠ 1BOX = 16kg 단위로 발주 (제품당 최소 1BOX).</div>
      <div id="prodList"></div>
      <div class="totalBox">
        <span class="lbl">총 금액<em id="totalWeightLine">총 0박스</em></span>
        <span class="val"><span id="grandTotal">0</span><small>원</small></span>
      </div>
    </div>

    <label class="check"><input type="checkbox" name="consent" value="1"> 입력하신 정보는 발주 접수·배송 목적으로만 사용됩니다. 동의합니다.</label>
    <p class="msg" id="formMsg">필수 항목과 제품을 선택해 주세요. 수량은 1BOX(16kg) 단위입니다.</p>
  </form>
</div>
</div>

<div class="bar" id="bar">
  <div class="inner">
    <div class="sum"><small id="barNote" class="warn">제품을 선택하세요</small><b><span id="barWeight">0</span>박스 · <span id="barTotal">0</span>원</b></div>
    <button type="submit" form="orderForm" class="btn" id="submitBtn" disabled>발주 신청하기</button>
  </div>
</div>

<script>
var ORDER_URL="https://script.google.com/macros/s/AKfycby3TzDJK0NcIR_ID2Q5L3yCMR4EDS26poDoakK8EKDS01zZ7ELkyC47A6N0c-6xiC6NgA/exec";
var BOX_KG=16;   /* 1BOX = 16kg */

/* 제품 마스터 (인덱스 고정 — 시트 컬럼 순서와 일치). kg=kg당 단가, 1BOX=15kg */
var PRODUCTS=[
  {key:"벌집삼겹살", kg:13500},
  {key:"벌집목살",   kg:13000},
  {key:"큐브삼겹살", kg:12000},
  {key:"큐브목전지", kg:11500}
];
function boxPrice(i){ return PRODUCTS[i].kg*BOX_KG; }  /* 1BOX 금액 */

var BRANDS=[
  {name:"냉면장인 임사부&숯불구이",        items:[2,3]},
  {name:"해장요리전문 임사부 국밥",         items:[2,3]},
  {name:"조선명가 묵은지 김치찜&김치찌개",  items:[2,3]},
  {name:"정육식당 직화고",                 items:[0,1,2,3]}
];

function won(n){return Number(n).toLocaleString("ko-KR");}
var currentBrand=null;

var bg=document.getElementById("brandGrid");
BRANDS.forEach(function(b,bi){
  var btn=document.createElement("button");
  btn.type="button"; btn.className="brandCard"; btn.onclick=function(){selectBrand(bi);};
  btn.innerHTML='<span><b>'+b.name+'</b><small>'+b.items.length+'종 발주 가능</small></span><span class="arw">›</span>';
  bg.appendChild(btn);
});

function selectBrand(bi){
  currentBrand=BRANDS[bi];
  document.getElementById("brandTag").textContent=currentBrand.name;
  renderProducts();
  document.getElementById("brandStep").classList.add("hidden");
  document.getElementById("orderStep").classList.remove("hidden");
  document.getElementById("bar").classList.add("on");
  window.scrollTo(0,0);
}
function goBrand(){
  document.getElementById("orderStep").classList.add("hidden");
  document.getElementById("brandStep").classList.remove("hidden");
  document.getElementById("bar").classList.remove("on");
  window.scrollTo(0,0);
}

function renderProducts(){
  var listEl=document.getElementById("prodList");
  listEl.innerHTML="";
  currentBrand.items.forEach(function(i){
    var p=PRODUCTS[i];
    var row=document.createElement("div");
    row.innerHTML=
      '<div class="prod">'
      +'<div class="prodInfo"><b>'+p.key+'</b><small>1BOX · 16kg</small></div>'
      +'<div class="prodPrice">'+won(boxPrice(i))+'원<em>/BOX</em></div>'
      +'<label class="tg"><input type="checkbox" data-i="'+i+'" class="tgIn"><span class="tk"></span></label>'
      +'</div>'
      +'<div class="qtyRow" id="qr'+i+'">'
      +'<div class="stepper"><button type="button" data-i="'+i+'" data-d="-1">−</button>'
      +'<input type="text" inputmode="numeric" class="qtyIn" id="q'+i+'" value="1" data-i="'+i+'"><button type="button" data-i="'+i+'" data-d="1">+</button></div>'
      +'<span class="qtyUnit">BOX</span>'
      +'<div class="lineSum" id="ls'+i+'">'+won(boxPrice(i))+'원</div>'
      +'</div>';
    listEl.appendChild(row);
  });
  calc();
}

function calc(){
  var total=0, boxes=0, sel=0;
  if(currentBrand){
    currentBrand.items.forEach(function(i){
      var on=document.querySelector('.tgIn[data-i="'+i+'"]').checked;
      var q=parseInt(document.getElementById('q'+i).value,10); if(isNaN(q)||q<1){q=1;}
      var bp=boxPrice(i);
      document.getElementById('ls'+i).textContent=won(bp*q)+'원';
      if(on){ sel++; total+=bp*q; boxes+=q; }
    });
  }
  document.getElementById('grandTotal').textContent=won(total);
  document.getElementById('barTotal').textContent=won(total);
  document.getElementById('barWeight').textContent=boxes;
  document.getElementById('totalWeightLine').textContent='총 '+boxes+'박스 ('+(boxes*BOX_KG)+'kg)';

  var canSubmit = sel>0;
  var btn=document.getElementById('submitBtn');
  var note=document.getElementById('barNote');
  btn.disabled=!canSubmit;
  if(sel===0){ note.textContent='제품을 선택하세요'; note.classList.add('warn'); }
  else { note.textContent='발주 가능 · 총 '+(boxes*BOX_KG)+'kg'; note.classList.remove('warn'); }
  return {total:total, boxes:boxes};
}
document.addEventListener('change',function(e){
  if(e.target.classList.contains('tgIn')){
    var i=e.target.getAttribute('data-i');
    document.getElementById('qr'+i).classList.toggle('on',e.target.checked);
    calc();
  }
});
document.addEventListener('click',function(e){
  if(e.target.matches('.stepper button')){
    var i=e.target.getAttribute('data-i'), d=parseInt(e.target.getAttribute('data-d'),10);
    var inp=document.getElementById('q'+i);
    var q=parseInt(inp.value,10); if(isNaN(q))q=1; q+=d; if(q<1)q=1; if(q>999)q=999;
    inp.value=q; calc();
  }
});
document.addEventListener('input',function(e){
  if(e.target.classList.contains('qtyIn')){
    e.target.value=e.target.value.replace(/[^0-9]/g,''); if(e.target.value==='0') e.target.value='1'; calc();
  }
});

function submitOrder(e){
  e.preventDefault();
  var f=e.target, msg=document.getElementById('formMsg');
  var g=function(n){return f.elements[n];};
  if(!currentBrand){ alert('브랜드를 먼저 선택해 주세요.'); return false; }
  if(!g('branch').value.trim()||!g('name').value.trim()||!g('phone').value.trim()||!g('address').value.trim()){
    alert('지점명·성함·연락처·주소를 모두 입력해 주세요.'); return false;
  }
  var items=[], totalBox=0, total=0, qty=[0,0,0,0];
  currentBrand.items.forEach(function(i){
    if(document.querySelector('.tgIn[data-i="'+i+'"]').checked){
      var q=parseInt(document.getElementById('q'+i).value,10); if(isNaN(q)||q<1)q=1;
      qty[i]=q; totalBox+=q; total+=boxPrice(i)*q;
      items.push(PRODUCTS[i].key+' '+q+'박스');
    }
  });
  if(!items.length){ alert('발주할 제품을 1개 이상 선택해 주세요.'); return false; }
  if(!g('consent').checked){ alert('개인정보 수집·이용에 동의해 주세요.'); return false; }

  /* 발주 단계에서는 저장하지 않음. 사업자등록증+이메일까지 제출해야 최종 접수됨 */
  var orderId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var summary=items.join(', ');
  _order={orderId:orderId,brand:currentBrand.name,branch:g('branch').value.trim(),name:g('name').value.trim(),phone:g('phone').value.trim(),address:g('address').value.trim(),qty:qty,summary:summary,totalBox:totalBox,total:total,page:location.href};
  showPayment();
  document.getElementById('bar').classList.remove('on');
  return false;
}

/* ===== 입금 안내 단계 ===== */
var _order=null;
var ACC_NO="1005-103-991052";
function showPayment(){
  var o=_order;
  document.getElementById('wrap').innerHTML=
    '<div class="head"><div class="ey">STEP · 입금</div><h1>입금 계좌 안내</h1>'
    +'<p>아래 계좌로 <b>입금 금액</b>을 입금하신 뒤 <b>입금 완료</b> 버튼을 눌러주세요.</p></div>'
    +'<div class="card"><h2>입금 계좌</h2>'
    +'<div class="payRow"><span>은행</span><b>우리은행</b></div>'
    +'<div class="payRow"><span>예금주</span><b>(주)에프엔비히어로</b></div>'
    +'<div class="payRow acc"><span>계좌번호</span><b id="accNo">'+ACC_NO+'</b></div>'
    +'<button type="button" class="copyBtn" onclick="copyAcc()">📋 계좌번호 복사</button>'
    +'<div class="payTotal"><span>입금 금액</span><b style="color:#d94b28">'+won(o.total)+'원</b></div>'
    +'</div>'
    +'<div class="card ord"><h2>발주 내역</h2>'
    +'<span class="brandTag">'+o.brand+'</span><br style="line-height:2.4">'
    +'<b>'+o.branch+'</b> · '+o.name+'<br>'+o.summary
    +'<br><b style="color:#d94b28">총 '+o.totalBox+'박스 ('+(o.totalBox*BOX_KG)+'kg)</b></div>'
    +'<div class="card"><h2>입금자명 <small style="font-weight:600;color:#6b7280">입금하실 분 성함</small></h2>'
    +'<input type="text" id="payerName" placeholder="예) 홍길동" value="'+o.name+'" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;background:#fff"></div>'
    +'<button type="button" class="btnWide" onclick="goTax()">입금 완료</button>'
    +'<p class="msg">입금 완료를 누르면 세금계산서 발행 정보를 입력합니다.</p>';
  window.scrollTo(0,0);
}
function copyAcc(){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ACC_NO).then(copiedToast,function(){fallbackCopy(ACC_NO);});
  } else { fallbackCopy(ACC_NO); }
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta); copiedToast();
}
function copiedToast(){
  var b=document.querySelector('.copyBtn'); if(!b)return;
  var o=b.textContent; b.textContent='✓ 복사되었습니다'; b.disabled=true;
  setTimeout(function(){b.textContent=o; b.disabled=false;},1600);
}
function showDone(){
  var o=_order;
  document.getElementById('wrap').innerHTML=
    '<div class="done"><div class="ic">✓</div><h2>발주가 접수되었습니다</h2>'
    +'<p style="color:#127a3e;font-weight:800;font-size:15px;margin:6px 0 2px;line-height:1.6">카톡 채팅방에 남겨주시면 빠른 확인이 가능합니다.</p>'
    +'<p>입금 확인 후 담당자가 배송을 진행합니다.<br>변경이 필요하시면 담당자에게 연락 주세요.</p>'
    +'<div class="rc"><span class="brandTag">'+o.brand+'</span><br style="line-height:2.4">'
    +'<b>'+o.branch+'</b> · '+o.name+'<br>'+o.summary
    +'<br><b style="color:#d94b28">총 '+o.totalBox+'박스 ('+(o.totalBox*BOX_KG)+'kg) · '+won(o.total)+'원</b></div></div>';
  window.scrollTo(0,0);
}

/* ===== 입금자명 → 세금계산서 단계 ===== */
function goTax(){
  var pn=(document.getElementById('payerName')||{}).value||'';
  pn=pn.trim();
  if(!pn){ alert('입금자명을 입력해 주세요.'); return; }
  _order.payer=pn;
  showTax();
}
function showTax(){
  document.getElementById('wrap').innerHTML=
    '<div class="head"><div class="ey">STEP · 세금계산서</div><h1>세금계산서 발행 정보</h1>'
    +'<p>계산서 발행을 위해 <b>사업자등록증 사진</b>과 <b>이메일</b>을 등록해 주세요.</p></div>'
    +'<div class="card"><h2>사업자등록증 <small style="font-weight:600;color:#6b7280">사진 첨부 (필수)</small></h2>'
    +'<input type="file" id="bizFile" accept="image/*" onchange="bizPick()" style="width:100%;font:inherit">'
    +'<p id="bizInfo" class="msg" style="margin-top:8px">사진을 선택하면 자동으로 최적화됩니다.</p></div>'
    +'<div class="card"><h2>이메일 <small style="font-weight:600;color:#6b7280">계산서 받을 주소 (필수)</small></h2>'
    +'<input type="email" id="taxEmail" inputmode="email" placeholder="example@email.com" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;background:#fff"></div>'
    +'<label class="check"><input type="checkbox" id="taxConsent" value="1"> 세금계산서 발행을 위한 정보 제공에 동의합니다.</label>'
    +'<button type="button" class="btnWide" id="taxBtn" onclick="submitTax()">제출하고 완료</button>'
    +'<p class="msg" id="taxMsg">사업자등록증 사진과 이메일을 모두 입력해 주세요.</p>';
  window.scrollTo(0,0);
}
function bizPick(){
  var el=document.getElementById('bizFile');
  var info=document.getElementById('bizInfo');
  if(el.files&&el.files[0]) info.textContent='선택됨: '+el.files[0].name;
}
function compressImage(file,cb){
  try{
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1600, w=img.width, h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      var d=c.toDataURL('image/jpeg',0.82);
      URL.revokeObjectURL(url);
      cb(d.split(',')[1], 'image/jpeg', ((file.name||'biz').replace(/\.[^.]+$/,''))+'.jpg');
    };
    img.onerror=function(){ cb(null); };
    img.src=url;
  }catch(err){ cb(null); }
}
function submitTax(){
  var fileEl=document.getElementById('bizFile');
  var email=(document.getElementById('taxEmail')||{}).value||''; email=email.trim();
  if(!fileEl.files||!fileEl.files[0]){ alert('사업자등록증 사진을 첨부해 주세요.'); return; }
  if(!email||email.indexOf('@')<0){ alert('올바른 이메일을 입력해 주세요.'); return; }
  if(!document.getElementById('taxConsent').checked){ alert('정보 제공에 동의해 주세요.'); return; }
  var btn=document.getElementById('taxBtn'); if(btn.disabled) return;
  btn.disabled=true; btn.textContent='제출 중...';
  compressImage(fileEl.files[0], function(b64,mime,name){
    if(!b64){ btn.disabled=false; btn.textContent='제출하고 완료'; alert('이미지 처리에 실패했습니다. 다른 사진으로 시도해 주세요.'); return; }
    var o=_order||{}; var qq=o.qty||[0,0,0,0];
    var fd=new FormData();
    fd.append('orderId', o.orderId||'');
    fd.append('brand', o.brand||'');
    fd.append('branch', o.branch||'');
    fd.append('name', o.name||'');
    fd.append('phone', o.phone||'');
    fd.append('address', o.address||'');
    fd.append('qty1',qq[0]); fd.append('qty2',qq[1]); fd.append('qty3',qq[2]); fd.append('qty4',qq[3]);
    fd.append('summary', o.summary||'');
    fd.append('totalQty', o.totalBox||0);
    fd.append('payer', o.payer||'');
    fd.append('taxEmail', email);
    fd.append('bizFile', b64);
    fd.append('bizType', mime);
    fd.append('bizName', name);
    fd.append('page', o.page||location.href);
    fetch(ORDER_URL,{method:'POST',mode:'no-cors',body:fd}).then(function(){ showDone(); })
      .catch(function(){ btn.disabled=false; btn.textContent='제출하고 완료';
        var m=document.getElementById('taxMsg'); if(m) m.textContent='제출 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'; });
  });
}
</script>
