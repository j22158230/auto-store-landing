<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품 발주 신청서 — FNB미디어</title>
<style>
:root{--ink:#20242a;--sub:#6b7280;--line:#e6e8eb;--bg:#f4f5f7;--card:#fff;--accent:#d94b28;--accent-soft:#fde9e2;--ok:#127a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 140px}
.head{padding:8px 2px 20px}
.head .ey{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.head h1{font-size:26px;margin:8px 0 6px;font-weight:900;letter-spacing:-.02em}
.head p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.card h2 small{font-weight:600;color:var(--sub);font-size:12px;margin-left:6px}
label.f{display:block;margin-top:14px}
label.f span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
label.f span i{color:var(--accent);font-style:normal}
input[type=text],input[type=tel]{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;background:#fff}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prod{display:flex;align-items:center;gap:12px;padding:16px 2px;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0}
.prodInfo{flex:1;min-width:0}
.prodInfo b{display:block;font-size:15px;font-weight:800}
.prodInfo small{color:var(--sub);font-size:12px}
.prodPrice{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap}
.tg{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg .tk{position:absolute;inset:0;background:#d3d7dd;border-radius:26px;transition:.18s}
.tg .tk:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked + .tk{background:var(--accent)}
.tg input:checked + .tk:before{transform:translateX(20px)}
.qtyRow{display:none;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 14px;margin-top:-4px}
.qtyRow.on{display:flex}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:40px;font-size:20px;font-weight:700;background:#fff;border:0;color:var(--ink);cursor:pointer}
.stepper button:active{background:var(--bg)}
.stepper input{width:52px;height:40px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);font:inherit;font-weight:800}
.lineSum{font-size:14px;font-weight:800;color:var(--accent)}
.totalBox{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 2px;border-top:2px solid var(--ink);margin-top:6px}
.totalBox .lbl{font-size:15px;font-weight:800}
.totalBox .val{font-size:24px;font-weight:900;letter-spacing:-.02em}
.totalBox .val small{font-size:14px;font-weight:700;margin-left:3px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5}
.check input{margin-top:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.bar .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .sum{flex:1;min-width:0}
.bar .sum small{display:block;font-size:11px;color:var(--sub)}
.bar .sum b{font-size:20px;font-weight:900}
.btn{flex:none;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:15px 24px;font-size:16px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.5}
.msg{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.done{text-align:center;padding:40px 10px}
.done .ic{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:34px;line-height:64px;margin:0 auto 16px}
.done h2{font-size:22px;margin:0 0 10px}
.done p{color:var(--sub);line-height:1.7;font-size:14px}
.done .rc{text-align:left;background:var(--bg);border-radius:12px;padding:16px;margin-top:18px;font-size:14px;line-height:1.9}
</style></head>
<body><div class="wrap" id="wrap">

<div class="head">
  <div class="ey">FNB미디어 · 제품 발주</div>
  <h1>제품 발주 신청서</h1>
  <p>지점 정보와 발주 제품을 선택하시면 합계가 자동 계산됩니다. 제출 시 담당자가 확인 후 배송해 드립니다.</p>
</div>

<form id="orderForm" onsubmit="return submitOrder(event)" novalidate>

  <div class="card">
    <h2>주문 정보</h2>
    <label class="f"><span>지점명 <i>*</i></span><input type="text" name="branch" placeholder="예) 서정점"></label>
    <label class="f"><span>주문자 성함 <i>*</i></span><input type="text" name="name" placeholder="성함"></label>
    <label class="f"><span>연락처 <i>*</i></span><input type="tel" name="phone" placeholder="010-0000-0000"></label>
    <label class="f"><span>배송받을 주소 <i>*</i></span><input type="text" name="address" placeholder="도로명 주소 + 상세주소"></label>
  </div>

  <div class="card">
    <h2>발주 제품 <small>BOX / 1kg · 필요한 제품을 켜고 수량을 입력하세요</small></h2>
    <div id="prodList"></div>
    <div class="totalBox"><span class="lbl">총 금액</span><span class="val"><span id="grandTotal">0</span><small>원</small></span></div>
  </div>

  <label class="check"><input type="checkbox" name="consent" value="1"> 입력하신 정보는 발주 접수·배송 목적으로만 사용됩니다. 동의합니다.</label>
  <p class="msg" id="formMsg">필수 항목(지점명·성함·연락처·주소)과 제품 1개 이상을 선택해 주세요.</p>
</form>
</div>

<div class="bar">
  <div class="inner">
    <div class="sum"><small>총 금액</small><b><span id="barTotal">0</span>원</b></div>
    <button type="submit" form="orderForm" class="btn">발주 신청하기</button>
  </div>
</div>

<script>
var ORDER_URL="https://script.google.com/macros/s/AKfycby3TzDJK0NcIR_ID2Q5L3yCMR4EDS26poDoakK8EKDS01zZ7ELkyC47A6N0c-6xiC6NgA/exec"; /* 배포된 Apps Script /exec 주소로 교체 */
var PRODUCTS=[
  {key:"벌집삼겹살", price:13500},
  {key:"벌집목살",   price:13000},
  {key:"큐브삼겹살", price:12000},
  {key:"큐브목전지", price:11500}
];
function won(n){return Number(n).toLocaleString("ko-KR");}
var listEl=document.getElementById("prodList");
PRODUCTS.forEach(function(p,i){
  var row=document.createElement("div");
  row.innerHTML=
    '<div class="prod">'
    +'<div class="prodInfo"><b>'+p.key+'</b><small>BOX · 1kg</small></div>'
    +'<div class="prodPrice">'+won(p.price)+'원</div>'
    +'<label class="tg"><input type="checkbox" data-i="'+i+'" class="tgIn"><span class="tk"></span></label>'
    +'</div>'
    +'<div class="qtyRow" id="qr'+i+'">'
    +'<div class="stepper"><button type="button" data-i="'+i+'" data-d="-1">−</button>'
    +'<input type="text" inputmode="numeric" class="qtyIn" id="q'+i+'" value="1" data-i="'+i+'"><button type="button" data-i="'+i+'" data-d="1">+</button></div>'
    +'<div class="lineSum" id="ls'+i+'">'+won(p.price)+'원</div>'
    +'</div>';
  listEl.appendChild(row);
});
function calc(){
  var total=0;
  PRODUCTS.forEach(function(p,i){
    var on=document.querySelector('.tgIn[data-i="'+i+'"]').checked;
    var q=parseInt(document.getElementById('q'+i).value,10); if(isNaN(q)||q<1){q=1;}
    var line=on?p.price*q:0;
    document.getElementById('ls'+i).textContent=won(p.price*q)+'원';
    total+=line;
  });
  document.getElementById('grandTotal').textContent=won(total);
  document.getElementById('barTotal').textContent=won(total);
  return total;
}
document.addEventListener('change',function(e){
  if(e.target.classList.contains('tgIn')){
    var i=e.target.getAttribute('data-i');
    document.getElementById('qr'+i).classList.toggle('on',e.target.checked);
    calc();
  }
});
document.addEventListener('click',function(e){
  if(e.target.matches('.stepper button')){
    var i=e.target.getAttribute('data-i'), d=parseInt(e.target.getAttribute('data-d'),10);
    var inp=document.getElementById('q'+i);
    var q=parseInt(inp.value,10); if(isNaN(q))q=1; q+=d; if(q<1)q=1; if(q>999)q=999;
    inp.value=q; calc();
  }
});
document.addEventListener('input',function(e){
  if(e.target.classList.contains('qtyIn')){
    e.target.value=e.target.value.replace(/[^0-9]/g,'');
    calc();
  }
});
calc();

function submitOrder(e){
  e.preventDefault();
  var f=e.target, msg=document.getElementById('formMsg');
  var g=function(n){return f.elements[n];};
  if(!g('branch').value.trim()||!g('name').value.trim()||!g('phone').value.trim()||!g('address').value.trim()){
    alert('지점명·성함·연락처·주소를 모두 입력해 주세요.'); return false;
  }
  var items=[], totalQty=0, total=0;
  PRODUCTS.forEach(function(p,i){
    if(document.querySelector('.tgIn[data-i="'+i+'"]').checked){
      var q=parseInt(document.getElementById('q'+i).value,10); if(isNaN(q)||q<1)q=1;
      items.push({key:p.key, qty:q, price:p.price});
      totalQty+=q; total+=p.price*q;
    }
  });
  if(!items.length){ alert('발주할 제품을 1개 이상 선택해 주세요.'); return false; }
  if(!g('consent').checked){ alert('개인정보 수집·이용에 동의해 주세요.'); return false; }

  var btn=document.querySelector('.btn');
  if(btn.disabled) return false;
  btn.disabled=true; btn.textContent='접수 중...';

  var fd=new FormData();
  fd.append('branch',g('branch').value.trim());
  fd.append('name',g('name').value.trim());
  fd.append('phone',g('phone').value.trim());
  fd.append('address',g('address').value.trim());
  PRODUCTS.forEach(function(p,i){
    var on=document.querySelector('.tgIn[data-i="'+i+'"]').checked;
    var q=on?(parseInt(document.getElementById('q'+i).value,10)||1):0;
    fd.append('qty'+(i+1), q);
  });
  var summary=items.map(function(it){return it.key+' '+it.qty+'박스';}).join(', ');
  fd.append('summary',summary);
  fd.append('totalQty',totalQty);
  fd.append('total',total);
  fd.append('page',location.href);

  fetch(ORDER_URL,{method:'POST',mode:'no-cors',body:fd}).then(function(){
    document.getElementById('wrap').innerHTML=
      '<div class="done"><div class="ic">✓</div><h2>발주가 접수되었습니다</h2>'
      +'<p>담당자가 확인 후 배송을 진행합니다.<br>변경이 필요하시면 담당자에게 연락 주세요.</p>'
      +'<div class="rc"><b>'+g('branch').value.trim()+'</b> · '+g('name').value.trim()+'<br>'
      +summary+'<br><b style="color:#d94b28">총 '+won(total)+'원</b></div></div>';
    document.querySelector('.bar').style.display='none';
  }).catch(function(){
    btn.disabled=false; btn.textContent='발주 신청하기';
    if(msg) msg.textContent='접수 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
  });
  return false;
}
</script>
</body></html>
